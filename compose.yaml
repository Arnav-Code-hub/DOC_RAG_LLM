services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      HF_HOME: /models
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_FREE_CONFIRMED: ${GROQ_FREE_CONFIRMED:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/data
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  qdrant_data:
  app_data:
  model_cache:
